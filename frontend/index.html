<!DOCTYPE html>
<html>
<head>
  <title>Interactive Online Compiler</title>
  <style>
    body { font-family: monospace; background: #111; color: #eee; }
    #editor { width: 100%; height: 200px; }
    #terminal { background: #000; color: #0f0; padding: 10px; height: 200px; overflow-y: auto; }
    #terminal input { background: #000; color: #0f0; border: none; width: 100%; }
  </style>
</head>
<body>
  <h2>Ultimate Online Compiler</h2>

  <textarea id="editor" placeholder="Write your code here"></textarea><br>

  <select id="language">
    <option value="c">C</option>
    <option value="cpp">C++</option>
    <option value="python">Python</option>
    <option value="java">Java</option>
  </select>
  <button onclick="runCode()">Run</button>

  <div id="terminal"></div>
  <input id="consoleInput" placeholder="Type input here and press Enter">

  <script src="script.js"></script>
</body>
</html>
