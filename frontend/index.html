<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Interactive Online Compiler</title>
  <link rel="stylesheet" href="style.css">
  <!-- CodeMirror CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
</head>
<body>
  <header>
    <h1>CodeBhavya Interactive Compiler</h1>
  </header>

  <main>
    <section id="editor-section">
      <select id="language">
        <option value="c">C</option>
        <option value="cpp">C++</option>
        <option value="python">Python</option>
        <option value="java">Java</option>
      </select>
      <button onclick="runCode()">Run</button>
      <button onclick="stopCode()">Stop</button>
      <textarea id="editor">// Write your code here</textarea>
    </section>

    <section id="terminal-section">
      <div id="terminal"></div>
      <input id="consoleInput" placeholder="Type input here and press Enter">
    </section>
  </main>

  <!-- CodeMirror JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
