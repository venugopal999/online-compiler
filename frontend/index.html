<!DOCTYPE html>
<html>
<head>
  <title>Online Compiler</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2>Ultimate Online Compiler</h2>
  <textarea id="input" rows="3" cols="40" placeholder="Program input here"></textarea>

  <select id="language">
    <option value="c">C</option>
    <option value="cpp">C++</option>
    <option value="python">Python</option>
    <option value="java">Java</option>
  </select>
  <textarea id="code" rows="15" cols="80">// Write your code here</textarea>
  <button onclick="runCode()">Run</button>
  <pre id="output"></pre>
  <script src="script.js"></script>
</body>
</html>
